# GitHub Actions workflow: copy this file to .github/workflows/api-tests.yml
# in a repository whose root holds practice-api/, collections/ and data/.
name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'    # every day at 02:30 UTC
  workflow_dispatch:         # adds a "Run workflow" button

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Newman and the HTML reporter
        run: npm install -g newman@6.2.3 newman-reporter-htmlextra@1.23.1

      - name: Start the practice API
        run: |
          cd practice-api
          nohup node server.js > ../api.log 2>&1 &

      - name: Wait until /health answers
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          echo "The API did not start within 30 seconds:"
          cat api.log
          exit 1

      - name: Run the API tests
        run: >
          newman run collections/ch27-newman-suite.postman_collection.json
          -e collections/local.postman_environment.json
          -r cli,junit,htmlextra
          --reporter-junit-export reports/junit.xml
          --reporter-htmlextra-export reports/api-report.html

      - name: Upload the reports
        if: always()          # also when the tests failed
        uses: actions/upload-artifact@v6
        with:
          name: api-test-reports
          path: |
            reports/
            api.log
